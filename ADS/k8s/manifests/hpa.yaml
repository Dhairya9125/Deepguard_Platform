apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ads-api-hpa
  namespace: ads
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ads-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ads-api-pdb
  namespace: ads
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ads
      component: api
