[build-system]
requires = ["setuptools>=75.0", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "ads"
version = "0.1.0"
description = "Enterprise-Grade Audio Deepfake Detection System"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "ADS Team", email = "team@ads.dev"}
]

keywords = ["deepfake-detection", "audio-forensics", "voice-biometrics", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "transformers>=4.50.0",
    "accelerate>=1.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "redis>=5.0",
    "kafka-python>=2.0.2",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "celery>=5.4.0",
    "mlflow>=2.20.0",
    "shap>=0.46.0",
    "lime>=0.2.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "plotly>=5.25.0",
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    
    "pydub>=0.25.0",
    "resampy>=0.4.0",
    "pyjwt>=2.10.0",
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=44.0.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "structlog>=25.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "fpdf2>=2.8.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.0.0",
    "tenacity>=8.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
    "bandit>=1.8.0",
    "safety>=3.0.0",
    "faker>=33.0.0",
    "hypothesis>=6.0.0",
    "tox>=4.0.0",
]
gpu = [
    "torch>=2.6.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]
dvc = [
    "dvc>=3.0.0",
    "dvc-s3>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ads*"]
namespaces = false

[tool.setuptools.package-data]
"ads" = ["py.typed"]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T10"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/*" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
allow_untyped_decorators = true
disallow_untyped_defs = false
disallow_any_unimported = false
warn_unused_ignores = true
exclude = ["tests/", "scripts/", "notebooks/", "examples/"]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "notebooks"]
skips = ["B101", "B303", "B404", "B603"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=ads --cov-report=term-missing --cov-report=html --strict-markers -ra"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "model: Model tests (slow)",
    "adversarial: Adversarial tests",
    "slow: Slow tests (skip with -m 'not slow')",
    "gpu: Tests requiring GPU",
]

[tool.coverage.run]
source = ["src/ads"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
