name: Model CI

on:
  push:
    paths:
      - "src/ads/models/**"
      - "src/ads/fusion/**"
      - "src/ads/signal_processing/**"
      - "src/ads/preprocessing/**"
  workflow_dispatch:
    inputs:
      experiment_name:
        description: "MLflow experiment name"
        required: false
        default: "ads-ci"

jobs:
  validate-models:
    name: Validate Model Architectures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install -e ".[dev]"

      - name: Validate model forward passes
        run: |
          python -c "
          import torch
          from ads.models.wavlm_branch.model import WavLMBranch
          from ads.models.xlsr_branch.model import XLSRBranch
          from ads.models.spectral_cnn_branch.model import SpectralCNN
          from ads.models.voice_biometrics.model import VoiceBiometricsBranch
          from ads.models.temporal_splice.model import TemporalSpliceBranch
          from ads.models.diffusion_detector.model import DiffusionDetectorBranch
          from ads.models.adversarial_detector.model import AdversarialDetectorBranch
          from ads.fusion.engine import FusionTransformer

          models = {
              'wavlm': WavLMBranch(),
              'xlsr': XLSRBranch(),
              'spectral': SpectralCNN(),
              'voice_biometrics': VoiceBiometricsBranch(),
              'temporal_splice': TemporalSpliceBranch(),
              'diffusion': DiffusionDetectorBranch(),
              'adversarial': AdversarialDetectorBranch(),
              'fusion': FusionTransformer(),
          }

          dummy_wave = torch.randn(1, 16000)

          for name, model in models.items():
              if name == 'spectral':
                  out = model(torch.randn(1, 3, 128, 128))
              elif name == 'voice_biometrics':
                  out = model(torch.randn(1, 100, 80))
              elif name == 'temporal_splice':
                  out = model(torch.randn(1, 50, 1024))
              elif name == 'fusion':
                  embs = {k: torch.randn(1, 256) for k in ['wavlm','xlsr','spectral','voice_biometrics','temporal','diffusion','adversarial']}
                  out = model(embs)
              else:
                  out = model(dummy_wave)

              assert 'logits' in out or 'probability' in out, f'{name} missing logits'
              print(f'  {name}: OK')

          print('All model architectures validated.')
          "

  benchmark:
    name: Model Benchmark
    runs-on: ubuntu-latest
    needs: validate-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Benchmark inference
        run: |
          python -c "
          import time, torch
          from ads.models.wavlm_branch.model import WavLMBranch
          model = WavLMBranch()
          dummy = torch.randn(1, 16000)
          times = []
          for _ in range(10):
              t0 = time.time()
              _ = model(dummy)
              times.append((time.time() - t0) * 1000)
          avg = sum(times) / len(times)
          print(f'WavLM avg inference: {avg:.1f}ms')
          assert avg < 5000, f'WavLM too slow: {avg:.1f}ms'
          "
